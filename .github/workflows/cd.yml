name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Install dependencies
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -version

      - name: Build package
        run: scripts/buildprod.sh

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/491383625273/locations/global/workloadIdentityPools/github/providers/my-repo'
          service_account: 'cloud-run-deployer@notely-514815.iam.gserviceaccount.com'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'
        with:
          version: '>= 363.0.0'

      - name: Upload image
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-514815/notely-ar-repo/notely:latest .


      - name: Migrate database
        run: ./scripts/migrateup.sh

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-514815/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-514815 --max-instances=4
